# Use a Nerd Font so terminal Emacs, doom-modeline, and nerd-icons
# can render icon glyphs correctly.
font_family      FiraCode Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 11.0

# Free C-S-- so applications such as Emacs receive C-_
map ctrl+shift+minus

# Move Kitty zoom-out to the numeric keypad -
map ctrl+shift+kp_subtract change_font_size all -2.0

# Allow remote control
allow_remote_control password
listen_on unix:/tmp/kitty

# Ensure export KITTY_RC_PASSWORD='open-local-url' is
# added to the remote machine's bashrc
remote_control_password "open-local-url" open_url_auth.py